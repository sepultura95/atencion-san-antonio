<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#0a0e14;
    --bg-card:#121923;
    --bg-card-2:#0d131b;
    --bg-hover:#182230;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.16);
    --text-primary:#f3f6fa;
    --text-secondary:#a9b7c6;
    --text-muted:#6c7a89;
    --accent:#5b9bdb;
    --accent-dim:#2c5d8f;
    --accent-glow:rgba(91,155,219,.35);
    --verde:#0ca30c;
    --amarillo:#fab219;
    --rojo:#d03b3b;
    --gris:#5b6672;
    --track:rgba(255,255,255,.08);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg-page);color:var(--text-primary);
    font-family:'IBM Plex Sans', sans-serif;-webkit-font-smoothing:antialiased;
    padding-bottom:60px;
    background-image:
      radial-gradient(900px 480px at 12% -8%, rgba(91,155,219,.14), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(23,196,120,.08), transparent 55%);
    background-attachment:fixed;
  }
  h1,h2,h3{font-family:inherit;font-weight:700;letter-spacing:-0.01em;margin:0;color:var(--text-primary);}
  button,select{font-family:inherit;cursor:pointer;}
  a{color:var(--accent);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a:focus-visible, button:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .topbar{
    background:linear-gradient(180deg,#0d1520,#0a0e14);
    padding:16px 22px;border-bottom:1px solid var(--border);position:relative;
    box-shadow:0 1px 0 var(--accent-dim);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto;}
  .topbar .left{display:flex;align-items:center;gap:12px;}
  .seal{
    width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;overflow:hidden;flex:none;
    box-shadow:0 0 0 1px var(--border-strong), 0 6px 18px rgba(91,155,219,.25);
  }
  .seal img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .topbar h1{font-size:18px;}
  .topbar .sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .topbar .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn-ghost{
    background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);
    padding:8px 14px;border-radius:7px;font-size:13px;text-decoration:none;display:inline-block;
  }
  .btn-ghost:hover{background:var(--bg-hover);border-color:var(--border-strong);}
  .text-ctrl{display:flex;gap:4px;flex:none;}
  .text-ctrl button{
    background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);
    width:30px;height:30px;border-radius:7px;font-weight:700;line-height:1;
  }
  .text-ctrl button:hover{background:var(--bg-hover);}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px;}

  .login-card{
    max-width:440px;margin:80px auto;background:var(--bg-card);border:1px solid var(--border);
    border-radius:var(--radius);padding:32px 28px;text-align:center;
  }
  .login-card h2{font-size:21px;margin-bottom:8px;}
  .login-card p{color:var(--text-secondary);font-size:14px;margin:0 0 20px;}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;border:none;padding:11px 18px;border-radius:7px;
    font-size:14px;font-weight:600;text-decoration:none;display:inline-block;
  }
  .btn-primary:hover{filter:brightness(1.1);}

  .dash-toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;
  }
  .dash-toolbar label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
  #sel-ambito{padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;background:var(--bg-card-2);color:var(--text-primary);min-width:270px;}
  .btn-actualizar{background:var(--bg-card-2);border:1px solid var(--border);color:var(--text-primary);padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;}
  .btn-actualizar:hover{background:var(--bg-hover);}

  .seccion{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .seccion h2{font-size:15px;}
  .seccion .seccion-sub{font-size:12.5px;color:var(--text-muted);margin:3px 0 16px;}
  .grid-2{display:grid;grid-template-columns:1.1fr 1.4fr;gap:18px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}

  /* ---------- KPI dial cards ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:18px;}
  .kpi-card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
    display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden;
  }
  .kpi-card::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;
  }
  .kpi-card.nv-verde::before{background:var(--verde);}
  .kpi-card.nv-amarillo::before{background:var(--amarillo);}
  .kpi-card.nv-rojo::before{background:var(--rojo);}
  .kpi-card.nv-gris::before{background:var(--gris);}
  .kpi-dial{flex:none;position:relative;width:84px;height:84px;}
  .kpi-dial svg{display:block;}
  .kpi-dial .dial-val{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--text-primary);text-align:center;line-height:1.1;
  }
  .kpi-body{flex:1;min-width:0;}
  .kpi-titulo{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .kpi-valor{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-bottom:6px;color:var(--text-primary);}
  .kpi-frase{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px;}
  .kpi-recom{font-size:12px;border-radius:6px;padding:7px 9px;line-height:1.4;border:1px solid;}
  .kpi-recom.nv-verde{color:#2fd43f;background:rgba(12,163,12,.12);border-color:rgba(12,163,12,.3);}
  .kpi-recom.nv-amarillo{color:var(--amarillo);background:rgba(250,178,25,.12);border-color:rgba(250,178,25,.3);}
  .kpi-recom.nv-rojo{color:#e8706b;background:rgba(208,59,59,.12);border-color:rgba(208,59,59,.3);}
  .kpi-recom.nv-gris{color:var(--text-muted);background:rgba(255,255,255,.04);border-color:var(--border);}

  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .dot.nv-verde{background:var(--verde);} .dot.nv-amarillo{background:var(--amarillo);}
  .dot.nv-rojo{background:var(--rojo);} .dot.nv-gris{background:var(--gris);}

  /* ---------- Donut + leyenda ---------- */
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .donut-legend{display:flex;flex-direction:column;gap:10px;font-size:13px;}
  .donut-legend .fila{display:flex;align-items:center;gap:8px;}
  .donut-legend .valor{font-family:'IBM Plex Mono',monospace;color:var(--text-primary);font-weight:600;margin-left:auto;padding-left:14px;}
  .donut-center-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
  .donut-center-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--text-primary);}

  /* ---------- Línea de tendencia ---------- */
  .linea-chart{display:block;}

  /* ---------- Listas de barras (por programa / funcionario) ---------- */
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px;}
  .bar-label{width:190px;font-size:13px;color:var(--text-secondary);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:var(--track);border-radius:6px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .5s ease;}
  .bar-value{width:160px;text-align:right;font-size:12px;color:var(--text-muted);flex:none;font-family:'IBM Plex Mono',monospace;}

  .resumen-texto{
    background:var(--bg-card-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--text-secondary);
  }

  .dash-footer{text-align:center;font-size:12px;color:var(--text-muted);margin-top:4px;}
  .vacio-aviso{font-size:13.5px;color:var(--text-muted);padding:10px 0;}
  .drill-link{font-size:12px;text-decoration:none;color:var(--accent);font-weight:600;margin-left:8px;}
  .drill-link:hover{text-decoration:underline;}

  @media (max-width:640px){
    .bar-label{width:110px;font-size:12px;}
    .bar-value{width:120px;font-size:11px;}
    .kpi-card{flex-direction:column;align-items:center;text-align:center;}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yjkibftpjvhedbmscbwo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_elPZQ7xh3ManlHtDWJY1DA_1TgwZvgk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PROGRAMAS = ['Adulto Mayor','Discapacidad','Víctimas del Conflicto','Comunidades Indígenas','Renta Ciudadana','Renta Joven','Devolución del IVA'];

/* ---------- Apariencia (reutiliza la misma configuración del portal/panel) ---------- */
async function inicializarApariencia(){
  try{
    const { data } = await sb.from('configuracion_sitio').select('*').eq('id', 1).single();
    if(!data || !data.logo_url) return;
    const seal = document.getElementById('seal');
    const px = data.logo_pos_x ?? 50, py = data.logo_pos_y ?? 50;
    const lz = (data.logo_zoom ?? 100) / 100;
    seal.innerHTML = `<img src="${data.logo_url}" alt="Escudo de la Alcaldía Municipal de San Antonio, Tolima" style="object-position:${px}% ${py}%;transform:scale(${lz});">`;
  }catch(e){ /* sin configuración todavía: queda el diseño por defecto */ }
}
inicializarApariencia();

/* ---------- Accesibilidad — control de tamaño de texto ---------- */
(function(){
  const NIVELES = [100, 115, 130, 145];
  let idx = parseInt(localStorage.getItem('sa_texto_idx') || '0', 10);
  if (isNaN(idx) || idx < 0 || idx >= NIVELES.length) idx = 0;
  function aplicar(){ document.body.style.zoom = NIVELES[idx] + '%'; }
  window.cambiarTextoTamano = function(dir){
    idx = (dir === 0) ? 0 : Math.min(NIVELES.length - 1, Math.max(0, idx + dir));
    localStorage.setItem('sa_texto_idx', idx);
    aplicar();
  };
  aplicar();
})();

/* ============================================================
   Estado y arranque
============================================================ */
let perfil = null;
let esCoordinador = false;
let solicitudesData = [];
let actividadesData = [];
let encuestasData = [];
let funcionariosMap = {};     // id -> nombre
let nombreAId = {};           // nombre -> id

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('login-gate').style.display = 'block';
    return;
  }
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ document.getElementById('login-gate').style.display = 'block'; return; }

  const { data, error } = await sb.from('perfiles_funcionario').select('*').eq('id', user.id).single();
  if(error || !data){
    document.getElementById('login-gate').style.display = 'block';
    return;
  }
  perfil = data;
  const misProgramas = (Array.isArray(perfil.programas) && perfil.programas.length > 0)
    ? perfil.programas
    : (perfil.programa ? [perfil.programa] : []);
  perfil.misProgramas = misProgramas;
  esCoordinador = misProgramas.includes('TODAS');

  document.getElementById('topbar-sub').textContent =
    (perfil.nombre || 'Funcionario') + ' · ' + (esCoordinador ? 'Coordinación (todos los programas)' : misProgramas.join(', '));

  document.getElementById('dash-shell').style.display = 'block';
  document.getElementById('btn-actualizar').addEventListener('click', cargarTodo);
  document.getElementById('sel-ambito').addEventListener('change', renderDashboard);

  await cargarTodo();
})();

async function cargarTodo(){
  const btn = document.getElementById('btn-actualizar');
  btn.disabled = true; btn.textContent = 'Actualizando…';
  try{
    const [solRes, actRes, encRes, perfRes] = await Promise.all([
      sb.from('solicitudes').select('*'),
      sb.from('actividades_administrativas').select('*'),
      sb.from('encuestas_satisfaccion').select('*'),
      sb.from('perfiles_funcionario').select('id, nombre'),
    ]);
    solicitudesData = solRes.data || [];
    actividadesData = actRes.data || [];
    encuestasData = encRes.data || [];
    funcionariosMap = {}; nombreAId = {};
    (perfRes.data || []).forEach(p => { funcionariosMap[p.id] = p.nombre; nombreAId[p.nombre] = p.id; });
    if(!funcionariosMap[perfil.id]){ funcionariosMap[perfil.id] = perfil.nombre || 'Yo'; nombreAId[perfil.nombre] = perfil.id; }

    poblarSelectorAmbito();
    renderDashboard();
    document.getElementById('dash-generado').textContent =
      'Generado con base en los datos registrados hasta ahora — ' + new Date().toLocaleString('es-CO');
  }catch(e){
    console.error(e);
    document.getElementById('dash-content').innerHTML = '<p class="vacio-aviso">No se pudieron cargar los indicadores. Intenta actualizar de nuevo.</p>';
  }
  btn.disabled = false; btn.textContent = '🔄 Actualizar';
}

/* ============================================================
   Selector de ámbito
============================================================ */
function poblarSelectorAmbito(){
  const sel = document.getElementById('sel-ambito');
  const valorPrevio = sel.value;
  sel.innerHTML = '';

  function opt(value, label){
    const o = document.createElement('option');
    o.value = value; o.textContent = label; sel.appendChild(o);
  }

  if(esCoordinador){
    opt('general', '📊 General (todos los programas)');
    opt('yo', '🙋 Mi desempeño (' + (perfil.nombre || 'yo') + ')');
    const ogP = document.createElement('optgroup'); ogP.label = 'Por programa';
    PROGRAMAS.forEach(p => { const o = document.createElement('option'); o.value = 'programa:' + p; o.textContent = p; ogP.appendChild(o); });
    sel.appendChild(ogP);
    const nombres = Object.values(funcionariosMap).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    if(nombres.length){
      const ogF = document.createElement('optgroup'); ogF.label = 'Por funcionario';
      nombres.forEach(n => { const o = document.createElement('option'); o.value = 'funcionario:' + n; o.textContent = n; ogF.appendChild(o); });
      sel.appendChild(ogF);
    }
  }else{
    opt('yo', '🙋 Mi desempeño');
    opt('general', '📊 General de ' + (perfil.misProgramas.length > 1 ? 'mis programas' : ('mi programa: ' + perfil.misProgramas[0])));
    if(perfil.misProgramas.length > 1){
      const ogP = document.createElement('optgroup'); ogP.label = 'Por programa';
      perfil.misProgramas.forEach(p => { const o = document.createElement('option'); o.value = 'programa:' + p; o.textContent = p; ogP.appendChild(o); });
      sel.appendChild(ogP);
    }
  }

  sel.value = valorPrevio && [...sel.options].some(o => o.value === valorPrevio) ? valorPrevio : (esCoordinador ? 'general' : 'yo');
}

function obtenerAmbito(){
  const val = document.getElementById('sel-ambito').value;
  let solicitudesScope = solicitudesData;
  let actividadesScope = actividadesData;
  let etiqueta = 'General (todos los programas)';
  let esIndividual = false;
  let esPrograma = false;

  if(val === 'yo'){
    etiqueta = 'Mi desempeño — ' + (perfil.nombre || '');
    solicitudesScope = solicitudesData.filter(s => s.atendido_por === perfil.nombre);
    actividadesScope = actividadesData.filter(a => a.funcionario_id === perfil.id);
    esIndividual = true;
  }else if(val.startsWith('funcionario:')){
    const nombre = val.slice('funcionario:'.length);
    const id = nombreAId[nombre];
    etiqueta = 'Desempeño de ' + nombre;
    solicitudesScope = solicitudesData.filter(s => s.atendido_por === nombre);
    actividadesScope = actividadesData.filter(a => a.funcionario_id === id);
    esIndividual = true;
  }else if(val.startsWith('programa:')){
    const prog = val.slice('programa:'.length);
    etiqueta = 'Programa: ' + prog;
    solicitudesScope = solicitudesData.filter(s => s.programa === prog);
    actividadesScope = []; // las actividades administrativas no están ligadas a un programa
    esPrograma = true;
  }else{
    etiqueta = esCoordinador ? 'General (todos los programas)' : ('General de ' + (perfil.misProgramas.length > 1 ? 'mis programas' : perfil.misProgramas[0]));
    if(!esCoordinador){
      solicitudesScope = solicitudesData.filter(s => perfil.misProgramas.includes(s.programa));
    }
  }

  const idsScope = new Set(solicitudesScope.map(s => s.id));
  const encuestasScope = encuestasData.filter(e => idsScope.has(e.solicitud_id));

  return { val, etiqueta, esIndividual, esPrograma, solicitudesScope, actividadesScope, encuestasScope };
}

/* ============================================================
   Cálculo de KPIs (mismo criterio usado en el Excel exportable)
============================================================ */
function redondear1(n){ return Math.round(n * 10) / 10; }
function promedioNum(arr){
  const nums = arr.filter(n => typeof n === 'number' && !isNaN(n));
  return nums.length ? nums.reduce((a,b)=>a+b,0) / nums.length : null;
}

function calcularKPIs(solicitudes, encuestas){
  const total = solicitudes.length;
  const resueltas = solicitudes.filter(s => s.estado === 'resuelto');
  const pendientes = solicitudes.filter(s => s.estado === 'pendiente').length;
  const enProceso = solicitudes.filter(s => s.estado === 'en_proceso').length;
  const eficacia = total ? (resueltas.length / total * 100) : null;

  const dias = resueltas
    .map(s => (s.created_at && s.resuelto_ts) ? (new Date(s.resuelto_ts) - new Date(s.created_at)) / (1000*60*60*24) : null)
    .filter(d => d !== null);
  const tiempoProm = promedioNum(dias);

  const satisfacciones = encuestas.map(e => (e.tangibles + e.fiabilidad + e.capacidad_respuesta + e.seguridad + e.empatia) / 5);
  const satisfaccion = promedioNum(satisfacciones);

  return { total, resueltas: resueltas.length, pendientes, enProceso, eficacia, tiempoProm, satisfaccion };
}

/* ---------- Semáforos ---------- */
function semEficacia(v){ if(v===null) return 'gris'; if(v>=80) return 'verde'; if(v>=50) return 'amarillo'; return 'rojo'; }
function semTiempo(v){ if(v===null) return 'gris'; if(v<=3) return 'verde'; if(v<=7) return 'amarillo'; return 'rojo'; }
function semSatisfaccion(v){ if(v===null) return 'gris'; if(v>=4) return 'verde'; if(v>=3) return 'amarillo'; return 'rojo'; }
function semComparativo(v, bench){
  if(v===null || bench===null || bench===0) return 'gris';
  const dif = (v - bench) / bench;
  if(dif >= -0.1) return 'verde';
  if(dif >= -0.3) return 'amarillo';
  return 'rojo';
}
const COLOR_NIVEL = { verde:'var(--verde)', amarillo:'var(--amarillo)', rojo:'var(--rojo)', gris:'var(--gris)' };

const TEXTOS = {
  eficacia: {
    verde: 'La mayoría de las solicitudes se están resolviendo. Vas por buen camino.',
    amarillo: 'Una parte importante de las solicitudes sigue sin resolverse.',
    rojo: 'Muy pocas solicitudes se están resolviendo frente a las que llegan.',

/* ============================================================
   Piezas visuales en SVG (anillos, dona, tendencia)
============================================================ */
function anilloSVG(pct, nivel, size=84, grosor=9){
  const r = (size - grosor) / 2, c = size/2, circ = 2*Math.PI*r;
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const offset = circ * (1 - p/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${grosor}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${COLOR_NIVEL[nivel]}" stroke-width="${grosor}"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      transform="rotate(-90 ${c} ${c})"/>
  </svg>`;
}

function medidorSVG(valorTexto, nivel, size=84, grosor=9){
  // "medidor" simple (sin porcentaje natural): anillo de 75% como marco decorativo con color de nivel
  const r = (size - grosor) / 2, c = size/2, circ = 2*Math.PI*r;
  const frac = nivel === 'gris' ? 0 : 0.72;
  const offset = circ * (1 - frac);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${grosor}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${COLOR_NIVEL[nivel]}" stroke-width="${grosor}"
      stroke-linecap="round" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      transform="rotate(-90 ${c} ${c})"/>
  </svg>`;
}

function donutMultiSVG(segmentos, size=160, grosor=22){
  const total = segmentos.reduce((s,x)=>s+x.valor,0);
  const r = (size-grosor)/2, c = size/2, circ = 2*Math.PI*r;
  if(!total){
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${grosor}"/></svg>`;
  }
  let acumulado = 0;
  const gapDeg = 2.2; // separación visual entre segmentos
  const circles = segmentos.filter(s => s.valor > 0).map(seg => {
    const frac = seg.valor/total;
    const largo = Math.max(0, circ*frac - (circ*gapDeg/360));
    const rot = -90 + (acumulado/total)*360;
    acumulado += seg.valor;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${grosor}"
      stroke-linecap="round" stroke-dasharray="${largo.toFixed(1)} ${(circ-largo).toFixed(1)}"
      transform="rotate(${rot.toFixed(1)} ${c} ${c})"><title>${seg.etiqueta}: ${seg.valor}</title></circle>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}

let idLineaChart = 0;
function lineaAreaSVG(valores, labels, { width=520, height=170 } = {}){
  idLineaChart++;
  const gradId = 'gradLinea' + idLineaChart;
  if(!valores.length || valores.every(v => v === 0)){
    return '<p class="vacio-aviso">Todavía no hay suficientes solicitudes registradas para mostrar una tendencia.</p>';
  }
  const max = Math.max(...valores, 1);
  const padL = 10, padR = 10, padT = 16, padB = 26;
  const w = width - padL - padR, h = height - padT - padB;
  const stepX = valores.length > 1 ? w/(valores.length-1) : 0;
  const pts = valores.map((v,i) => ({ x: padL + i*stepX, y: padT + h - (v/max)*h }));
  const line = pts.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1].x.toFixed(1)},${(padT+h).toFixed(1)} L${pts[0].x.toFixed(1)},${(padT+h).toFixed(1)} Z`;
  const puntos = pts.map((p,i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--bg-card)" stroke-width="2"><title>${labels[i]}: ${valores[i]} solicitud${valores[i]===1?'':'es'}</title></circle>`).join('');
  const etiquetasEje = labels.map((l,i) => `<text x="${pts[i].x.toFixed(1)}" y="${height-6}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" class="linea-chart" preserveAspectRatio="none" style="width:100%;height:${height}px;">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gradId})" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${puntos}
    ${etiquetasEje}
  </svg>`;
}

/* ============================================================
   Tarjetas KPI
============================================================ */
function tarjetaKPI({titulo, valorTexto, nivel, frase, recomendacion, dial}){
  const recomHtml = recomendacion
    ? `<div class="kpi-recom nv-${nivel}">${nivel==='verde' ? '✓ ' : '→ '}${recomendacion}</div>`
    : '';
  return `
    <div class="kpi-card nv-${nivel}">
      <div class="kpi-dial">${dial}<div class="dial-val">${valorTexto}</div></div>
      <div class="kpi-body">
        <div class="kpi-titulo"><span class="dot nv-${nivel}"></span>${titulo}</div>
        <div class="kpi-frase">${frase}</div>
        ${recomHtml}
      </div>
    </div>`;
}

function construirKPIs(kpis, { conProductividad, actividadesScope, bench } = {}){
  const cards = [];

  const nivEf = semEficacia(kpis.eficacia);
  cards.push(tarjetaKPI({
    titulo: 'Eficacia',
    valorTexto: kpis.eficacia !== null ? redondear1(kpis.eficacia) + '%' : '—',
    nivel: nivEf,
    dial: anilloSVG(kpis.eficacia, nivEf),
    frase: `${kpis.resueltas} resueltas de ${kpis.total} recibidas. ${TEXTOS.eficacia[nivEf]}`,
    recomendacion: nivEf==='verde' ? 'Mantén el ritmo actual de resolución.' : TEXTOS.eficaciaRecom[nivEf],
  }));

  const nivTi = semTiempo(kpis.tiempoProm);
  cards.push(tarjetaKPI({
    titulo: 'Tiempo promedio de resolución',
    valorTexto: kpis.tiempoProm !== null ? redondear1(kpis.tiempoProm) + 'd' : '—',
    nivel: nivTi,
    dial: medidorSVG(kpis.tiempoProm, nivTi),
    frase: TEXTOS.tiempo[nivTi],
    recomendacion: nivTi==='verde' ? 'Sigue respondiendo con esta misma agilidad.' : TEXTOS.tiempoRecom[nivTi],
  }));

  const nivSa = semSatisfaccion(kpis.satisfaccion);
  cards.push(tarjetaKPI({
    titulo: 'Satisfacción ciudadana',
    valorTexto: kpis.satisfaccion !== null ? redondear1(kpis.satisfaccion) + '/5' : '—',
    nivel: nivSa,
    dial: anilloSVG(kpis.satisfaccion !== null ? kpis.satisfaccion/5*100 : null, nivSa),
    frase: TEXTOS.satisfaccion[nivSa],
    recomendacion: nivSa==='verde' ? 'Los ciudadanos lo están notando: sigue así.' : TEXTOS.satisfaccionRecom[nivSa],
  }));

  if(conProductividad){
    const totalAct = actividadesScope.reduce((sum,a) => sum + (a.cantidad || 1), 0);
    const minutosAct = actividadesScope.reduce((sum,a) => sum + (a.tiempo_minutos || 0), 0);
    const productividad = kpis.resueltas + totalAct;
    let nivPr = 'gris', fraseP = 'Suma de solicitudes resueltas y actividades administrativas registradas.';
    if(bench && bench.productividadProm !== null){
      nivPr = semComparativo(productividad, bench.productividadProm);
      const comp = nivPr === 'verde' ? 'por encima del' : (nivPr === 'amarillo' ? 'cerca del' : 'por debajo del');
      fraseP = `${comp} promedio del equipo (${redondear1(bench.productividadProm)}). Incluye ${kpis.resueltas} solicitudes resueltas y ${totalAct} actividades administrativas (${minutosAct} min).`;
    }
    cards.push(tarjetaKPI({
      titulo: 'Productividad',
      valorTexto: String(productividad),
      nivel: nivPr,
      dial: medidorSVG(productividad, nivPr),
      frase: fraseP,
      recomendacion: nivPr==='rojo' ? 'Podría valer la pena revisar su carga de trabajo o si necesita apoyo.' : (nivPr==='verde' ? 'Buen nivel de producción frente al resto del equipo.' : null),
    }));
  }

  return `<div class="kpi-grid">${cards.join('')}</div>`;
}

/* ============================================================
   Dona de estado + tendencia mensual
============================================================ */
function construirDonaEstado(kpis){
  if(!kpis.total){
    return '<p class="vacio-aviso">Todavía no hay solicitudes registradas en este ámbito.</p>';
  }
  const segmentos = [
    { etiqueta:'Resueltas', valor: kpis.resueltas, color: 'var(--verde)' },
    { etiqueta:'En proceso', valor: kpis.enProceso, color: 'var(--amarillo)' },
    { etiqueta:'Pendientes', valor: kpis.pendientes, color: 'var(--rojo)' },
  ];
  const pct = n => Math.round((n/kpis.total)*100);
  return `
    <div class="donut-wrap">
      <div style="position:relative;width:160px;height:160px;flex:none;">
        ${donutMultiSVG(segmentos)}
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="donut-center-val">${kpis.total}</div>
          <div class="donut-center-label">total</div>
        </div>
      </div>
      <div class="donut-legend">
        <div class="fila"><span class="dot nv-verde"></span>Resueltas <span class="valor">${kpis.resueltas} · ${pct(kpis.resueltas)}%</span></div>
        <div class="fila"><span class="dot nv-amarillo"></span>En proceso <span class="valor">${kpis.enProceso} · ${pct(kpis.enProceso)}%</span></div>
        <div class="fila"><span class="dot nv-rojo"></span>Pendientes <span class="valor">${kpis.pendientes} · ${pct(kpis.pendientes)}%</span></div>
      </div>
    </div>`;
}

function construirTendenciaMensual(solicitudesScope){
  const meses = [];
  const hoy = new Date();
  for(let i = 7; i >= 0; i--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ clave: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), etiqueta: d.toLocaleDateString('es-CO', { month:'short' }).replace('.','') });
  }
  const conteos = meses.map(m => solicitudesScope.filter(s => s.created_at && s.created_at.slice(0,7) === m.clave).length);
  return lineaAreaSVG(conteos, meses.map(m => m.etiqueta));
}

/* ============================================================
   Listas tipo barra: por programa / por funcionario
============================================================ */
function construirListaBarras(filas, { selectorDestino } = {}){
  if(!filas.length) return '<p class="vacio-aviso">No hay datos suficientes todavía.</p>';
  return filas.map(f => {
    const nivel = semEficacia(f.eficacia);
    const ancho = f.eficacia !== null ? Math.max(4, Math.round(f.eficacia)) : 4;
    const drill = (selectorDestino && f.valorAmbito)
      ? `<a class="drill-link" href="#" onclick="irAAmbito('${f.valorAmbito.replace(/'/g,"\\'")}');return false;">Ver detalle</a>`
      : '';
    return `
      <div class="bar-row">
        <div class="bar-label">${f.etiqueta}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${ancho}%;background:${COLOR_NIVEL[nivel]};"></div></div>
        <div class="bar-value">${f.detalle}${drill}</div>
      </div>`;
  }).join('');
}

function irAAmbito(valor){
  const sel = document.getElementById('sel-ambito');
  if([...sel.options].some(o => o.value === valor)){
    sel.value = valor;
    renderDashboard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ============================================================
   Render principal
============================================================ */
function renderDashboard(){
  const ambito = obtenerAmbito();
  const kpis = calcularKPIs(ambito.solicitudesScope, ambito.encuestasScope);
  const bench = (ambito.esIndividual) ? calcularBenchProductividad() : null;

  let html = '';
  html += `<div class="seccion"><h2>${ambito.etiqueta}</h2>`;
  html += `<p class="seccion-sub">Indicadores calculados sobre lo que tienes registrado en este ámbito.</p>`;
  html += construirKPIs(kpis, { conProductividad: !ambito.esPrograma, actividadesScope: ambito.actividadesScope, bench });
  html += `</div>`;

  html += `<div class="grid-2">`;
  html += `<div class="seccion"><h2>Solicitudes por estado</h2><p class="seccion-sub">Distribución del total en este ámbito.</p>${construirDonaEstado(kpis)}</div>`;
  html += `<div class="seccion"><h2>Tendencia mensual</h2><p class="seccion-sub">Solicitudes creadas por mes, últimos 8 meses.</p>${construirTendenciaMensual(ambito.solicitudesScope)}</div>`;
  html += `</div>`;

  html += `<div class="seccion"><h2>Resumen en palabras simples</h2>`;
  html += `<div class="resumen-texto">${construirResumenTexto(ambito, kpis)}</div>`;
  html += `</div>`;

  if(!ambito.esIndividual && !ambito.esPrograma){
    const programasVisibles = [...new Set(ambito.solicitudesScope.map(s => s.programa).filter(Boolean))];
    const filasPrograma = programasVisibles.map(p => {
      const deEsePrograma = ambito.solicitudesScope.filter(s => s.programa === p);
      const resueltasP = deEsePrograma.filter(s => s.estado === 'resuelto').length;
      const eficaciaP = deEsePrograma.length ? (resueltasP / deEsePrograma.length * 100) : null;
      return {
        etiqueta: p,
        eficacia: eficaciaP,
        detalle: `${resueltasP}/${deEsePrograma.length} · ${eficaciaP!==null ? redondear1(eficaciaP) : 0}%`,
        valorAmbito: 'programa:' + p,
      };
    }).sort((a,b) => (b.eficacia ?? 0) - (a.eficacia ?? 0));
    html += `<div class="seccion"><h2>Desempeño por programa</h2>`;
    html += `<p class="seccion-sub">Porcentaje de solicitudes resueltas sobre el total recibido en cada programa.</p>`;
    html += construirListaBarras(filasPrograma, { selectorDestino: true });
    html += `</div>`;
  }

  if(!ambito.esIndividual){
    const nombresVisibles = [...new Set(ambito.solicitudesScope.map(s => s.atendido_por).filter(Boolean))];
    const filasFunc = nombresVisibles.map(n => {
      const deEseFunc = ambito.solicitudesScope.filter(s => s.atendido_por === n);
      const resueltasF = deEseFunc.filter(s => s.estado === 'resuelto').length;
      const eficaciaF = deEseFunc.length ? (resueltasF / deEseFunc.length * 100) : null;
      return {
        etiqueta: n,
        eficacia: eficaciaF,
        detalle: `${resueltasF}/${deEseFunc.length} · ${eficaciaF!==null ? redondear1(eficaciaF) : 0}%`,
        valorAmbito: esCoordinador ? ('funcionario:' + n) : null,
      };
    }).sort((a,b) => (b.eficacia ?? 0) - (a.eficacia ?? 0));
    if(filasFunc.length){
      html += `<div class="seccion"><h2>Desempeño por funcionario</h2>`;
      html += `<p class="seccion-sub">Solicitudes resueltas sobre el total atendido por cada funcionario, en este ámbito.</p>`;
      html += construirListaBarras(filasFunc, { selectorDestino: esCoordinador });
      html += `</div>`;
    }
  }

  document.getElementById('dash-content').innerHTML = html;
}

function calcularBenchProductividad(){
  const nombres = [...new Set([
    ...solicitudesData.map(s => s.atendido_por).filter(Boolean),
    ...actividadesData.map(a => funcionariosMap[a.funcionario_id]).filter(Boolean),
  ])];
  if(!nombres.length) return { productividadProm: null };
  const valores = nombres.map(n => {
    const resueltasN = solicitudesData.filter(s => s.atendido_por === n && s.estado === 'resuelto').length;
    const id = nombreAId[n];
    const actN = actividadesData.filter(a => a.funcionario_id === id).reduce((sum,a) => sum + (a.cantidad || 1), 0);
    return resueltasN + actN;
  });
  return { productividadProm: promedioNum(valores) };
}

function construirResumenTexto(ambito, kpis){
  if(!kpis.total){
    return 'Todavía no hay solicitudes registradas en este ámbito, así que no es posible generar un análisis. Cuando se registren las primeras solicitudes, este resumen se irá completando automáticamente.';
  }
  const partes = [];
  const nivEf = semEficacia(kpis.eficacia);
  const nivTi = semTiempo(kpis.tiempoProm);
  const nivSa = semSatisfaccion(kpis.satisfaccion);

  partes.push(`De las ${kpis.total} solicitudes de este ámbito, se han resuelto ${kpis.resueltas} (${redondear1(kpis.eficacia)}%).`);

  if(nivEf === 'rojo' || nivTi === 'rojo' || nivSa === 'rojo'){
    partes.push('Hay al menos un indicador en rojo que conviene atender pronto — revisa las tarjetas de arriba para ver cuál y qué se recomienda hacer.');
  }else if(nivEf === 'amarillo' || nivTi === 'amarillo' || nivSa === 'amarillo'){
    partes.push('En general la gestión va razonablemente bien, aunque hay algún indicador en amarillo con espacio para mejorar.');
  }else{
    partes.push('Los tres indicadores principales (eficacia, tiempo de respuesta y satisfacción) están en buen nivel. Buen trabajo.');
  }

  if(kpis.satisfaccion === null){
    partes.push('Todavía no hay encuestas de satisfacción respondidas en este ámbito; a medida que los ciudadanos las contesten, este dato se irá completando.');
  }

  return partes.join(' ');
}
