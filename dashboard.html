/* ---------- Accesibilidad — control de tamaño de texto ---------- */
(function(){
  const NIVELES = [100, 115, 130, 145];
  let idx = parseInt(localStorage.getItem('sa_texto_idx') || '0', 10);
  if (isNaN(idx) || idx < 0 || idx >= NIVELES.length) idx = 0;
  function aplicar(){ document.body.style.zoom = NIVELES[idx] + '%'; }
  window.cambiarTextoTamano = function(dir){
    idx = (dir === 0) ? 0 : Math.min(NIVELES.length - 1, Math.max(0, idx + dir));
    localStorage.setItem('sa_texto_idx', idx);
    aplicar();
  };
  aplicar();
})();

/* ============================================================
   Estado y arranque

let perfil = null;
let esCoordinador = false;
let solicitudesData = [];
let actividadesData = [];
let encuestasData = [];
let funcionariosMap = {};     // id -> nombre
let nombreAId = {};           // nombre -> id
let kpiGeneral = null;        // punto de comparación ("promedio del equipo")

async function cargarTodo(){
  const btn = document.getElementById('btn-actualizar');
  btn.disabled = true; btn.textContent = 'Actualizando…';
  try{
    const [solRes, actRes, encRes, perfRes] = await Promise.all([
      sb.from('solicitudes').select('*'),
      sb.from('actividades_administrativas').select('*'),
      sb.from('encuestas_satisfaccion').select('*'),
      sb.from('perfiles_funcionario').select('id, nombre'),
    ]);
    solicitudesData = solRes.data || [];
    actividadesData = actRes.data || [];
    encuestasData = encRes.data || [];
    funcionariosMap = {}; nombreAId = {};
    (perfRes.data || []).forEach(p => { funcionariosMap[p.id] = p.nombre; nombreAId[p.nombre] = p.id; });
    if(!funcionariosMap[perfil.id]){ funcionariosMap[perfil.id] = perfil.nombre || 'Yo'; nombreAId[perfil.nombre] = perfil.id; }

    kpiGeneral = calcularKPIs(solicitudesData, encuestasData);

/* ============================================================
   Selector de ámbito
============================================================ */
function poblarSelectorAmbito(){
  const sel = document.getElementById('sel-ambito');
  const valorPrevio = sel.value;
  sel.innerHTML = '';

  function opt(value, label){
    const o = document.createElement('option');
    o.value = value; o.textContent = label; sel.appendChild(o);
  }

  if(esCoordinador){
    opt('general', '📊 General (todos los programas)');
    opt('yo', '🙋 Mi desempeño (' + (perfil.nombre || 'yo') + ')');
    const ogP = document.createElement('optgroup'); ogP.label = 'Por programa';
    PROGRAMAS.forEach(p => { const o = document.createElement('option'); o.value = 'programa:' + p; o.textContent = p; ogP.appendChild(o); });
    sel.appendChild(ogP);
    const nombres = Object.values(funcionariosMap).filter(Boolean).sort((a,b)=>a.localeCompare(b));
    if(nombres.length){
      const ogF = document.createElement('optgroup'); ogF.label = 'Por funcionario';
      nombres.forEach(n => { const o = document.createElement('option'); o.value = 'funcionario:' + n; o.textContent = n; ogF.appendChild(o); });
      sel.appendChild(ogF);
    }
  }else{
    opt('yo', '🙋 Mi desempeño');
    opt('general', '📊 General de ' + (perfil.misProgramas.length > 1 ? 'mis programas' : ('mi programa: ' + perfil.misProgramas[0])));
    if(perfil.misProgramas.length > 1){
      const ogP = document.createElement('optgroup'); ogP.label = 'Por programa';
      perfil.misProgramas.forEach(p => { const o = document.createElement('option'); o.value = 'programa:' + p; o.textContent = p; ogP.appendChild(o); });
      sel.appendChild(ogP);
    }
  }

  sel.value = valorPrevio && [...sel.options].some(o => o.value === valorPrevio) ? valorPrevio : (esCoordinador ? 'general' : 'yo');
}

function obtenerAmbito(){
  const val = document.getElementById('sel-ambito').value;
  let solicitudesScope = solicitudesData;
  let actividadesScope = actividadesData;
  let etiqueta = 'General (todos los programas)';
  let esIndividual = false;
  let esPrograma = false;

  if(val === 'yo'){
    etiqueta = 'Mi desempeño — ' + (perfil.nombre || '');
    solicitudesScope = solicitudesData.filter(s => s.atendido_por === perfil.nombre);
    actividadesScope = actividadesData.filter(a => a.funcionario_id === perfil.id);
    esIndividual = true;
  }else if(val.startsWith('funcionario:')){
    const nombre = val.slice('funcionario:'.length);
    const id = nombreAId[nombre];
    etiqueta = 'Desempeño de ' + nombre;
    solicitudesScope = solicitudesData.filter(s => s.atendido_por === nombre);
    actividadesScope = actividadesData.filter(a => a.funcionario_id === id);
    esIndividual = true;
  }else if(val.startsWith('programa:')){
    const prog = val.slice('programa:'.length);
    etiqueta = 'Programa: ' + prog;
    solicitudesScope = solicitudesData.filter(s => s.programa === prog);
    actividadesScope = []; // las actividades administrativas no están ligadas a un programa
    esPrograma = true;
  }else{
    etiqueta = esCoordinador ? 'General (todos los programas)' : ('General de ' + (perfil.misProgramas.length > 1 ? 'mis programas' : perfil.misProgramas[0]));
    if(!esCoordinador){
      solicitudesScope = solicitudesData.filter(s => perfil.misProgramas.includes(s.programa));
    }
  }

  const idsScope = new Set(solicitudesScope.map(s => s.id));
  const encuestasScope = encuestasData.filter(e => idsScope.has(e.solicitud_id));

  return { val, etiqueta, esIndividual, esPrograma, solicitudesScope, actividadesScope, encuestasScope };
}

/* ============================================================
   Cálculo de KPIs (mismo criterio usado en el Excel exportable)
============================================================ */
function redondear1(n){ return Math.round(n * 10) / 10; }
function promedioNum(arr){
  const nums = arr.filter(n => typeof n === 'number' && !isNaN(n));
  return nums.length ? nums.reduce((a,b)=>a+b,0) / nums.length : null;
}

function calcularKPIs(solicitudes, encuestas){
  const total = solicitudes.length;
  const resueltas = solicitudes.filter(s => s.estado === 'resuelto');
  const pendientes = solicitudes.filter(s => s.estado === 'pendiente').length;
  const enProceso = solicitudes.filter(s => s.estado === 'en_proceso').length;
  const eficacia = total ? (resueltas.length / total * 100) : null;

  const dias = resueltas
    .map(s => (s.created_at && s.resuelto_ts) ? (new Date(s.resuelto_ts) - new Date(s.created_at)) / (1000*60*60*24) : null)
    .filter(d => d !== null);
  const tiempoProm = promedioNum(dias);

  const satisfacciones = encuestas.map(e => (e.tangibles + e.fiabilidad + e.capacidad_respuesta + e.seguridad + e.empatia) / 5);
  const satisfaccion = promedioNum(satisfacciones);

  return { total, resueltas: resueltas.length, pendientes, enProceso, eficacia, tiempoProm, satisfaccion };
}

/* ---------- Semáforos ---------- */
function semEficacia(v){ if(v===null) return 'gris'; if(v>=80) return 'verde'; if(v>=50) return 'amarillo'; return 'rojo'; }
function semTiempo(v){ if(v===null) return 'gris'; if(v<=3) return 'verde'; if(v<=7) return 'amarillo'; return 'rojo'; }
function semSatisfaccion(v){ if(v===null) return 'gris'; if(v>=4) return 'verde'; if(v>=3) return 'amarillo'; return 'rojo'; }
function semComparativo(v, bench){
  if(v===null || bench===null || bench===0) return 'gris';
  const dif = (v - bench) / bench;
  if(dif >= -0.1) return 'verde';
  if(dif >= -0.3) return 'amarillo';
  return 'rojo';
}

function tarjetaKPI({titulo, valorTexto, nivel, frase, recomendacion}){
  const recomHtml = recomendacion
    ? `<div class="kpi-recom${nivel==='verde' ? ' ok' : ''}">${nivel==='verde' ? '✓ ' : '→ '}${recomendacion}</div>`
    : '';

    <div class="kpi-card">

      <div class="kpi-valor">${valorTexto}</div>
      <div class="kpi-frase">${frase}</div>
      ${recomHtml}
    </div>`;
}

function construirKPIs(kpis, { conProductividad, actividadesScope, bench } = {}){
  const cards = [];

  const nivEf = semEficacia(kpis.eficacia);
  cards.push(tarjetaKPI({
    titulo: 'Eficacia',
    valorTexto: kpis.eficacia !== null ? redondear1(kpis.eficacia) + '%' : '—',
    nivel: nivEf,
    frase: `${kpis.resueltas} resueltas de ${kpis.total} recibidas. ${TEXTOS.eficacia[nivEf]}`,
    recomendacion: nivEf==='verde' ? 'Mantén el ritmo actual de resolución.' : TEXTOS.eficaciaRecom[nivEf],
  }));

  const nivTi = semTiempo(kpis.tiempoProm);
  cards.push(tarjetaKPI({
    titulo: 'Tiempo promedio de resolución',
    valorTexto: kpis.tiempoProm !== null ? redondear1(kpis.tiempoProm) + ' días' : '—',
    nivel: nivTi,
    frase: TEXTOS.tiempo[nivTi],
    recomendacion: nivTi==='verde' ? 'Sigue respondiendo con esta misma agilidad.' : TEXTOS.tiempoRecom[nivTi],
  }));

  const nivSa = semSatisfaccion(kpis.satisfaccion);
  cards.push(tarjetaKPI({
    titulo: 'Satisfacción ciudadana',
    valorTexto: kpis.satisfaccion !== null ? redondear1(kpis.satisfaccion) + ' / 5' : '—',
    nivel: nivSa,
    frase: TEXTOS.satisfaccion[nivSa],
    recomendacion: nivSa==='verde' ? 'Los ciudadanos lo están notando: sigue así.' : TEXTOS.satisfaccionRecom[nivSa],
  }));

  if(conProductividad){
    const totalAct = actividadesScope.reduce((sum,a) => sum + (a.cantidad || 1), 0);
    const minutosAct = actividadesScope.reduce((sum,a) => sum + (a.tiempo_minutos || 0), 0);
    const productividad = kpis.resueltas + totalAct;
    let nivPr = 'gris', fraseP = 'Suma de solicitudes resueltas y actividades administrativas registradas.';
    if(bench && bench.productividadProm !== null){
      nivPr = semComparativo(productividad, bench.productividadProm);
      const comp = nivPr === 'verde' ? 'por encima del' : (nivPr === 'amarillo' ? 'cerca del' : 'por debajo del');
      fraseP = `${comp} promedio del equipo (${redondear1(bench.productividadProm)}). Incluye ${kpis.resueltas} solicitudes resueltas y ${totalAct} actividades administrativas (${minutosAct} min).`;
    }
    cards.push(tarjetaKPI({
      titulo: 'Productividad',
      valorTexto: String(productividad),
      nivel: nivPr,
      frase: fraseP,
      recomendacion: nivPr==='rojo' ? 'Podría valer la pena revisar su carga de trabajo o si necesita apoyo.' : (nivPr==='verde' ? 'Buen nivel de producción frente al resto del equipo.' : null),
    }));
  }

  return `<div class="kpi-grid">${cards.join('')}</div>`;
}

/* ============================================================
   Barra de estado (pendiente / en proceso / resuelto)
============================================================ */
function construirBarraEstado(kpis){
  if(!kpis.total){
    return '<p class="vacio-aviso">Todavía no hay solicitudes registradas en este ámbito.</p>';
  }
  const pct = n => Math.round((n / kpis.total) * 100);
  return `
    <div class="bar-track" style="height:26px;">
      ${kpis.resueltas ? `<div class="bar-fill" style="width:${pct(kpis.resueltas)}%;background:var(--verde-ok);"></div>` : ''}
      ${kpis.enProceso ? `<div class="bar-fill" style="width:${pct(kpis.enProceso)}%;background:var(--ochre-500);"></div>` : ''}
      ${kpis.pendientes ? `<div class="bar-fill" style="width:${pct(kpis.pendientes)}%;background:var(--red-700);"></div>` : ''}
    </div>
    <div class="estado-legend">
      <span><i style="background:var(--verde-ok);"></i>Resueltas: ${kpis.resueltas} (${pct(kpis.resueltas)}%)</span>
      <span><i style="background:var(--ochre-500);"></i>En proceso: ${kpis.enProceso} (${pct(kpis.enProceso)}%)</span>
      <span><i style="background:var(--red-700);"></i>Pendientes: ${kpis.pendientes} (${pct(kpis.pendientes)}%)</span>
    </div>`;
}

/* ============================================================
   Listas tipo barra: por programa / por funcionario
============================================================ */
function construirListaBarras(filas, { selectorDestino } = {}){
  // filas: [{ etiqueta, eficacia, detalle, valorAmbito }]
  if(!filas.length) return '<p class="vacio-aviso">No hay datos suficientes todavía.</p>';
  return filas.map(f => {
    const nivel = semEficacia(f.eficacia);
    const color = nivel==='verde' ? 'var(--verde-ok)' : nivel==='amarillo' ? 'var(--ochre-500)' : nivel==='rojo' ? 'var(--red-700)' : 'var(--gris-na)';
    const ancho = f.eficacia !== null ? Math.max(4, Math.round(f.eficacia)) : 4;
    const drill = (selectorDestino && f.valorAmbito)
      ? ` · <a class="drill-link" href="#" onclick="irAAmbito('${f.valorAmbito.replace(/'/g,"\\'")}');return false;">Ver detalle</a>`
      : '';
    return `
      <div class="bar-row">
        <div class="bar-label">${f.etiqueta}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${ancho}%;background:${color};"></div></div>
        <div class="bar-value">${f.detalle}${drill}</div>
      </div>`;
  }).join('');
}

function irAAmbito(valor){
  const sel = document.getElementById('sel-ambito');
  if([...sel.options].some(o => o.value === valor)){
    sel.value = valor;
    renderDashboard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* ============================================================
   Render principal
============================================================ */
function renderDashboard(){
  const ambito = obtenerAmbito();
  const kpis = calcularKPIs(ambito.solicitudesScope, ambito.encuestasScope);
  const bench = (ambito.esIndividual) ? calcularBenchProductividad() : null;

  let html = '';
  html += `<div class="seccion"><h2>${ambito.etiqueta}</h2>`;
  html += `<p class="seccion-sub">Indicadores calculados sobre lo que tienes registrado en este ámbito.</p>`;
  html += construirKPIs(kpis, { conProductividad: !ambito.esPrograma, actividadesScope: ambito.actividadesScope, bench });
  html += `</div>`;

  html += `<div class="seccion"><h2>Solicitudes por estado</h2>`;
  html += construirBarraEstado(kpis);
  html += `</div>`;

  html += `<div class="seccion"><h2>Resumen en palabras simples</h2>`;
  html += `<div class="resumen-texto">${construirResumenTexto(ambito, kpis)}</div>`;
  html += `</div>`;

  if(!ambito.esIndividual && !ambito.esPrograma){
    // vista general: desglose por programa
    const programasVisibles = [...new Set(ambito.solicitudesScope.map(s => s.programa).filter(Boolean))];
    const filasPrograma = programasVisibles.map(p => {
      const deEsePrograma = ambito.solicitudesScope.filter(s => s.programa === p);
      const resueltasP = deEsePrograma.filter(s => s.estado === 'resuelto').length;
      const eficaciaP = deEsePrograma.length ? (resueltasP / deEsePrograma.length * 100) : null;
      return {
        etiqueta: p,
        eficacia: eficaciaP,
        detalle: `${resueltasP}/${deEsePrograma.length} (${eficaciaP!==null ? redondear1(eficaciaP) : 0}%)`,
        valorAmbito: 'programa:' + p,
      };
    }).sort((a,b) => (b.eficacia ?? 0) - (a.eficacia ?? 0));
    html += `<div class="seccion"><h2>Desempeño por programa</h2>`;
    html += `<p class="seccion-sub">Porcentaje de solicitudes resueltas sobre el total recibido en cada programa.</p>`;
    html += construirListaBarras(filasPrograma, { selectorDestino: true });
    html += `</div>`;
  }

  if(!ambito.esIndividual){
    // desglose por funcionario (disponible en general y en vista de programa)
    const nombresVisibles = [...new Set(ambito.solicitudesScope.map(s => s.atendido_por).filter(Boolean))];
    const filasFunc = nombresVisibles.map(n => {
      const deEseFunc = ambito.solicitudesScope.filter(s => s.atendido_por === n);
      const resueltasF = deEseFunc.filter(s => s.estado === 'resuelto').length;
      const eficaciaF = deEseFunc.length ? (resueltasF / deEseFunc.length * 100) : null;
      return {
        etiqueta: n,
        eficacia: eficaciaF,
        detalle: `${resueltasF}/${deEseFunc.length} (${eficaciaF!==null ? redondear1(eficaciaF) : 0}%)`,
        valorAmbito: esCoordinador ? ('funcionario:' + n) : null,
      };
    }).sort((a,b) => (b.eficacia ?? 0) - (a.eficacia ?? 0));
    if(filasFunc.length){
      html += `<div class="seccion"><h2>Desempeño por funcionario</h2>`;
      html += `<p class="seccion-sub">Solicitudes resueltas sobre el total atendido por cada funcionario, en este ámbito.</p>`;
      html += construirListaBarras(filasFunc, { selectorDestino: esCoordinador });
      html += `</div>`;
    }
  }

  document.getElementById('dash-content').innerHTML = html;
}

function calcularBenchProductividad(){
  // promedio de productividad (resueltas + actividades) entre todos los funcionarios visibles
  const nombres = [...new Set([
    ...solicitudesData.map(s => s.atendido_por).filter(Boolean),
    ...actividadesData.map(a => funcionariosMap[a.funcionario_id]).filter(Boolean),
  ])];
  if(!nombres.length) return { productividadProm: null };
  const valores = nombres.map(n => {
    const resueltasN = solicitudesData.filter(s => s.atendido_por === n && s.estado === 'resuelto').length;
    const id = nombreAId[n];
    const actN = actividadesData.filter(a => a.funcionario_id === id).reduce((sum,a) => sum + (a.cantidad || 1), 0);
    return resueltasN + actN;
  });
  return { productividadProm: promedioNum(valores) };
}

function construirResumenTexto(ambito, kpis){
  if(!kpis.total){
    return 'Todavía no hay solicitudes registradas en este ámbito, así que no es posible generar un análisis. Cuando se registren las primeras solicitudes, este resumen se irá completando automáticamente.';
  }
  const partes = [];
  const nivEf = semEficacia(kpis.eficacia);
  const nivTi = semTiempo(kpis.tiempoProm);
  const nivSa = semSatisfaccion(kpis.satisfaccion);

  partes.push(`De las ${kpis.total} solicitudes de este ámbito, se han resuelto ${kpis.resueltas} (${redondear1(kpis.eficacia)}%).`);

  if(nivEf === 'rojo' || nivTi === 'rojo' || nivSa === 'rojo'){
    partes.push('Hay al menos un indicador en rojo que conviene atender pronto — revisa las tarjetas de arriba para ver cuál y qué se recomienda hacer.');
  }else if(nivEf === 'amarillo' || nivTi === 'amarillo' || nivSa === 'amarillo'){
    partes.push('En general la gestión va razonablemente bien, aunque hay algún indicador en amarillo con espacio para mejorar.');
  }else{
    partes.push('Los tres indicadores principales (eficacia, tiempo de respuesta y satisfacción) están en buen nivel. Buen trabajo.');
  }

  if(kpis.satisfaccion === null){
    partes.push('Todavía no hay encuestas de satisfacción respondidas en este ámbito; a medida que los ciudadanos las contesten, este dato se irá completando.');
  }

  return partes.join(' ');
}
